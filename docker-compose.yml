services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: inspection-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  mosquitto-data:
